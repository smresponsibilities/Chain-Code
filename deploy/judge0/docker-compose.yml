x-judge0-defaults: &judge0-defaults
  env_file: judge0.conf
  depends_on:
    - db
    - redis

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    <<: *judge0-defaults
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *judge0-defaults
    restart: always
    deploy:
      replicas: 2 # matches 2 OCPU on Oracle Always Free Ampere A1 — bump if you resize the VM

  db:
    image: postgres:16.2
    env_file: db.env
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data/
    restart: always

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'redis-server --daemonize no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: always

volumes:
  judge0-postgres-data:
