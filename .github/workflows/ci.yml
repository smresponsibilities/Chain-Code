name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: SEO lint (content gates)
        run: npm run seo:check --prefix frontend

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check all source files
        run: for f in $(find . -name "*.js" -not -path "./node_modules/*"); do node --check "$f"; done
      - name: Smoke tests (security behavior)
        run: node smoke-test.mjs
        env:
          SMOKE_TARGET: ${{ vars.SMOKE_TARGET }}
        continue-on-error: true # requires reachable deployment; hard-fails locally via npm script
